<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部落冲突兵种卡牌交换匹配工具【云端共享版】</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft YaHei",system-ui,sans-serif;}
body{background:#f6f8fa;padding:20px;max-width:1200px;margin:0 auto;line-height:1.6;}
h2{text-align:center;margin-bottom:8px;color:#222;}
.tip-orange{color:#f26522;text-align:center;margin-bottom:24px;font-weight:bold;}
.box{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px #00000012;}
h3{margin-bottom:12px;font-size:17px;color:#111;}
.input-row{margin-bottom:12px;}
label{display:block;font-size:14px;margin-bottom:4px;color:#333;}
input[type="text"]{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;}
.warn-text{font-size:13px;color:#d03030;margin:4px 0 10px 0;}
.btns{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;}
button{padding:9px 18px;border-radius:6px;border:none;cursor:pointer;font-size:14px;transition:0.2s;}
.btn-green{background:#28a745;color:#fff;}
.btn-green:hover{background:#218838;}
.btn-grey{background:#6c757d;color:#fff;}
.btn-grey:hover{background:#5a6268;}
.btn-blue{background:#007bff;color:#fff;}
.btn-blue:hover{background:#0069d9;}
.btn-purple{background:#784fd1;color:#fff;}
.btn-purple:hover{background:#633fc0;}
.loading-tip{text-align:center;margin:10px;color:#0069d9;}
#result-area{width:100%;min-height:180px;border:1px solid #dde1f5;background:#f0f3ff;border-radius:6px;padding:12px;white-space:pre-wrap;}
.card-group{margin-bottom:14px;}
.tag{display:inline-block;padding:4px 9px;border:1px solid #b8c4e8;border-radius:4px;margin:4px 6px 4px 0;cursor:pointer;font-size:13px;}
.tag.active{background:#366ed8;color:#fff;border-color:#366ed8;}
.player-item{border:1px solid #e4e7ed;border-radius:6px;padding:10px;margin-bottom:8px;font-size:14px;}
.player-item button{padding:4px 10px;margin:4px 6px 0 0;font-size:12px;}
</style>
<!-- 必须引入 Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<h2>部落冲突兵种卡牌交换匹配工具【云端共享版】</h2>
<div class="tip-orange">云端数据实时同步，群内所有人共用一份名单！交换卡牌后记得更新列表信息</div>

<div class="box">
    <h3>你的QQ号 (身份标识，用于权限校验)</h3>
    <div class="input-row">
        <input id="input-qq" type="text" placeholder="请输入QQ号，作为唯一身份">
    </div>
    <div class="warn-text">▲ 输入QQ号后，如果云端存在你的记录会自动加载第一条信息进入编辑</div>

    <h3>所在群群号</h3>
    <div class="input-row">
        <input id="input-group" type="text" placeholder="填写需要交换的目标QQ群群号">
    </div>
    <div class="warn-text">▲ 仅相同群号的成员之间会进行交换匹配</div>

    <div style="display:flex;align-items:center;gap:8px;margin:12px 0;">
        <input type="checkbox" id="remember-check">
        <label for="remember-check">记住我的QQ号与群号（下次打开自动填充）</label>
        <button class="btn-grey" onclick="clearSavedInfo()">清除已保存信息</button>
    </div>
</div>

<div class="box">
    <h3>添加玩家信息</h3>
    <div class="warn-text">群昵称（游戏有小号的情况下可以加个“（小号）”）</div>
    <div class="input-row">
        <input id="input-nick" type="text" placeholder="输入你的群昵称">
    </div>
    <div id="card-panel"></div>
    <div class="btns">
        <button class="btn-green" onclick="addPlayer()">新增玩家</button>
        <button class="btn-grey" onclick="cancelEdit()">取消编辑</button>
    </div>
</div>

<div class="box">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
        <h3>已录入玩家列表</h3>
        <button class="btn-grey" onclick="togglePlayerList()">收起列表</button>
        <button class="btn-blue" onclick="fetchAllPlayers()">刷新云端数据</button>
    </div>
    <div class="loading-tip" id="loading-tip">正在从云端加载数据...</div>
    <div id="player-list"></div>
</div>

<div class="btns">
    <button class="btn-green" onclick="matchTrade()">开始匹配可交换组合</button>
    <button class="btn-purple" onclick="copyResult()">复制匹配结果</button>
</div>
<textarea readonly id="result-area">匹配结果会显示在这里</textarea>

<script>
// ===================== Supabase配置 =====================
const SUPABASE_URL = "https://pieiqwijxatssefbuyll.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_muupKx9zSPp6kNAoMOosyw_vKKOOyTB";
// ========================================================
const { createClient } = supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const cardData = {
    "圣水": ["蛮子", "弓箭", "胖子", "哥布林", "炸弹人", "气球", "法师", "天使", "飞龙", "皮卡", "龙宝", "矿工", "雷龙", "雪怪", "龙骑士", "泰坦", "根蔓", "牙签", "陨石哥伦"],
    "黑油": ["亡灵", "野猪", "武神", "石头人", "女巫", "天狗", "蓝胖", "冰人", "猎手", "小永王", "格鲁伊", "熔炉", "废墟女巫"],
    "夜世界": ["蛮子", "弓箭", "胖子", "亡灵", "炸弹人", "龙宝", "加农炮", "女巫", "气球", "皮卡", "飞猪"],
    "超级兵": ["超蛮", "超弓", "超胖", "超哥", "超炸", "超球", "超法", "超龙", "地狱龙", "超矿", "超级雪怪", "超级亡灵", "超猪", "超级武神", "超巫", "冰狗", "超蓝"]
};

let selectedExtra = new Set();
let selectedNeed = new Set();
let editRecordId = null;
let allPlayers = [];
let playerListOpen = true;
const STORAGE_KEY = "trade_login";

window.onload = async function () {
    renderCardPanel();
    loadLoginInfo();
    await fetchAllPlayers();
};

// 刷新云端数据
async function fetchAllPlayers() {
    const loadingBox = document.getElementById("loading-tip");
    loadingBox.style.display = "block";
    document.getElementById("player-list").innerHTML = "";
    try {
        const { data, error } = await supabase
            .from('player_data')
            .select('*')
            .order('created_at', { ascending: false });
        if (error) throw error;
        allPlayers = data;
        renderPlayerList();
    } catch (err) {
        alert("加载失败：" + err.message);
        console.error(err);
    } finally {
        loadingBox.style.display = "none";
    }
}

// 渲染兵种选择面板
function renderCardPanel() {
    const wrap = document.getElementById('card-panel');
    wrap.innerHTML = '';
    for (const type in cardData) {
        const block = document.createElement('div');
        block.className = 'card-group';
        block.innerHTML = `<h4>【${type}】</h4>`;

        const extraLine = document.createElement('div');
        extraLine.innerHTML = "<span>多余卡牌：</span>";
        cardData[type].forEach(name => {
            const span = document.createElement("span");
            span.className = selectedExtra.has(name) ? "tag active" : "tag";
            span.innerText = name;
            span.onclick = () => {
                selectedExtra.has(name) ? selectedExtra.delete(name) : selectedExtra.add(name);
                renderCardPanel();
            };
            extraLine.appendChild(span);
        });
        block.appendChild(extraLine);

        const needLine = document.createElement('div');
        needLine.innerHTML = "<span>需求卡牌：</span>";
        cardData[type].forEach(name => {
            const span = document.createElement("span");
            span.className = selectedNeed.has(name) ? "tag active" : "tag";
            span.innerText = name;
            span.onclick = () => {
                selectedNeed.has(name) ? selectedNeed.delete(name) : selectedNeed.add(name);
                renderCardPanel();
            };
            needLine.appendChild(span);
        });
        block.appendChild(needLine);
        wrap.appendChild(block);
    }
}

// 展开/收起玩家列表
function togglePlayerList() {
    playerListOpen = !playerListOpen;
    const listDom = document.getElementById("player-list");
    listDom.style.display = playerListOpen ? "block" : "none";
}

// 新增/保存玩家
async function addPlayer() {
    const qq = document.getElementById("input-qq").value.trim();
    const groupId = document.getElementById("input-group").value.trim();
    const nick = document.getElementById("input-nick").value.trim();
    if (!qq || !groupId || !nick) {
        alert("QQ号、群号、昵称不能为空！");
        return;
    }
    const payload = {
        qq,
        groupnum: groupId,
        nickname: nick,
        extra: JSON.stringify([...selectedExtra]),
        need: JSON.stringify([...selectedNeed])
    };
    try {
        if (editRecordId) {
            const { error } = await supabase.from("player_data").update(payload).eq("id", editRecordId);
            if (error) throw error;
            alert("修改成功");
        } else {
            const { error } = await supabase.from("player_data").insert(payload);
            if (error) throw error;
            alert("新增成功");
        }
        cancelEdit();
        await fetchAllPlayers();
    } catch (e) {
        alert("保存失败：" + e.message);
    }
}

// 取消编辑
function cancelEdit() {
    editRecordId = null;
    document.getElementById("input-nick").value = "";
    selectedExtra.clear();
    selectedNeed.clear();
    renderCardPanel();
}

// 渲染玩家列表
function renderPlayerList() {
    const wrap = document.getElementById("player-list");
    wrap.innerHTML = "";
    allPlayers.forEach(p => {
        const div = document.createElement("div");
        div.className = "player-item";
        div.innerHTML = `
            <div>QQ:${p.qq} | 群号:${p.groupnum} | 昵称:${p.nickname}</div>
            <div>多余：${JSON.parse(p.extra).join("、")}</div>
            <div>需求：${JSON.parse(p.need).join("、")}</div>
            <button onclick="editPlayer(${p.id})">编辑</button>
            <button onclick="delPlayer(${p.id})">删除</button>
        `;
        wrap.appendChild(div);
    });
}

// 编辑玩家
async function editPlayer(id) {
    const target = allPlayers.find(x => x.id === id);
    if (!target) return;
    editRecordId = id;
    document.getElementById("input-qq").value = target.qq;
    document.getElementById("input-group").value = target.groupnum;
    document.getElementById("input-nick").value = target.nickname;
    selectedExtra = new Set(JSON.parse(target.extra));
    selectedNeed = new Set(JSON.parse(target.need));
    renderCardPanel();
}

// 删除玩家
async function delPlayer(id) {
    if (!confirm("确定删除这条记录？")) return;
    try {
        const { error } = await supabase.from("player_data").delete().eq("id", id);
        if (error) throw error;
        await fetchAllPlayers();
    } catch (e) {
        alert("删除失败：" + e.message);
    }
}

// 本地存储：加载账号
function loadLoginInfo() {
    const str = localStorage.getItem(STORAGE_KEY);
    if (str) {
        const info = JSON.parse(str);
        document.getElementById("input-qq").value = info.qq || "";
        document.getElementById("input-group").value = info.group || "";
        document.getElementById("remember-check").checked = true;
    }
}
// 保存账号
function saveLoginInfo() {
    const checkBox = document.getElementById("remember-check");
    if (!checkBox.checked) {
        localStorage.removeItem(STORAGE_KEY);
        return;
    }
    const qq = document.getElementById("input-qq").value.trim();
    const group = document.getElementById("input-group").value.trim();
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ qq, group }));
}
// 清除保存信息
function clearSavedInfo() {
    localStorage.removeItem(STORAGE_KEY);
    document.getElementById("input-qq").value = "";
    document.getElementById("input-group").value = "";
    document.getElementById("remember-check").checked = false;
    alert("已清除");
}

// 匹配交换
function matchTrade() {
    const selfQQ = document.getElementById("input-qq").value.trim();
    const selfGroup = document.getElementById("input-group").value.trim();
    if (!selfQQ || !selfGroup) {
        alert("先填写QQ和群号！");
        return;
    }
    const myData = allPlayers.find(p => p.qq === selfQQ && p.groupnum === selfGroup);
    if (!myData) {
        alert("当前QQ+群号没有录入交换信息！");
        return;
    }
    const myNeed = JSON.parse(myData.need);
    const myExtra = JSON.parse(myData.extra);
    let resultText = "===== 可交换匹配结果 =====\n";
    let hasMatch = false;
    allPlayers.forEach(other => {
        if (other.qq === selfQQ || other.groupnum !== selfGroup) return;
        const otherNeed = JSON.parse(other.need);
        const otherExtra = JSON.parse(other.extra);
        const giveToHim = myExtra.filter(c => otherNeed.includes(c));
        const getFromHim = otherExtra.filter(c => myNeed.includes(c));
        if (giveToHim.length > 0 && getFromHim.length > 0) {
            hasMatch = true;
            resultText += `【${other.nickname} QQ:${other.qq}】\n`;
            resultText += `我给他：${giveToHim.join("、")}\n`;
            resultText += `他给我：${getFromHim.join("、")}\n\n`;
        }
    });
    if (!hasMatch) resultText += "暂无合适交换对象";
    document.getElementById("result-area").innerText = resultText;
}
// 复制结果
function copyResult() {
    const text = document.getElementById("result-area").innerText;
    navigator.clipboard.writeText(text).then(() => alert("复制成功"));
}

// 监听QQ/群号输入自动保存
document.getElementById('input-qq').addEventListener('change', saveLoginInfo);
document.getElementById('input-group').addEventListener('change', saveLoginInfo);
document.getElementById('remember-check').addEventListener('change', saveLoginInfo);
</script>
</body>
</html>
